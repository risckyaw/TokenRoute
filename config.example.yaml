listen: ":8400"
usage_db: "data/usage.db"

# Admin API key (X-Admin-Key header). Empty/missing -> /admin routes return 503.
admin_key: "${GATEWAY_ADMIN_KEY}"

# Max request body size in MB (default 10).
#max_body_mb: 10

# USD per 1M tokens, keyed by UPSTREAM model name.
# context_tokens (optional) enables the context-window guard for that model.
prices:
  deepseek-chat: {prompt_per_1m: 0.14, completion_per_1m: 0.28, context_tokens: 64000}
  gpt-4o-mini:   {prompt_per_1m: 0.15, completion_per_1m: 0.60, context_tokens: 128000}
  gpt-4o:        {prompt_per_1m: 2.50, completion_per_1m: 10.00, context_tokens: 128000}
  # expr (new-api billingexpr port): one expression per model evaluated per
  # request; WINS over the flat fields entirely for chat cost. Variables:
  # p (billable prompt tokens), c (completion), len (total input incl. cache
  # tokens, for tier conditions), cr (cached-read), cc (cache-creation),
  # cc1h (1h-TTL cache creation), img (image in), ai (audio in), ao (audio
  # out). Coefficients are USD per 1M tokens; the result is auto-divided by
  # 1e6. tier(name, cost) records the matched tier in the usage log
  # (price_tier column). [OI] semantics: cr/cc/img/ai are subtracted from p
  # ONLY when the expression references them; anthropic providers report
  # input_tokens text-only so nothing is subtracted (len = p+cr+cc instead).
  # Invalid expressions fail config load. Cached-token pricing needs no
  # separate knob — price cr explicitly: 'p*2 + c*8 + cr*0.2'.
  #claude-sonnet:
  #  expr: 'p <= 200000 ? tier("standard", p*3.0 + c*15.0) : tier("long_context", p*6.0 + c*22.5)'
  #  context_tokens: 200000

providers:
  # Secrets via env vars only — never commit real keys.
  - name: openai
    type: openai
    base_url: "https://api./v1"
    api_key: "${OPENAI_API_KEY}"   # ${VAR} expanded from environment
    priority: 10
    timeout_ms: 120000
    # Optional per-provider circuit breaker (defaults shown):
    # opens after N consecutive failures, cools down, then allows 1 probe.
    # auto_disable_after: after N open-transitions the provider is disabled
    # until POST /admin/providers/{name}/enable (default 3; 0 = default).
    circuit: {failure_threshold: 3, cooldown_ms: 30000, auto_disable_after: 3}
    # Percent mode (LiteLLM): trip when failures in the current minute >=
    # max(min_requests, failure_percent * total_minute_requests). Default mode
    # is "consecutive" (above). Example:
    # circuit: {mode: percent, failure_percent: 0.5, min_requests: 5, cooldown_ms: 30000}
    # Per-exception budgets (LiteLLM allowed_fails): consecutive failures of a
    # kind tolerated before opening (trips at N+1). Kinds not listed use the
    # global threshold; auth/permission stay instant-open unless listed.
    # Kind names: auth, permission, rate_limit, quota_exhausted, timeout,
    # server, invalid_request, model_unavailable, network, unknown.
    # circuit: {failure_threshold: 3, cooldown_ms: 30000,
    #           allowed_fails: {timeout: 10, rate_limit: 3, server: 5, quota_exhausted: 1}}
    # Background health check (default disabled): minimal probe
    # (max_tokens=1, "hi") on an interval, feeding circuit state and latency
    # EMA so they stay warm before user traffic. Never writes usage rows or
    # touches the quota ledger. Global default via top-level health_check:;
    # this per-provider block wins.
    #health_check: {enabled: true, interval_ms: 60000, model: gpt-4o-mini}
    # Bounds ONLY the wait for upstream response headers (default 15min).
    # Streaming after headers arrive is unaffected. 0 = default.
    #response_header_timeout_ms: 900000
    # Max silence between SSE chunks before the stream is cut (default 5min).
    #stream_idle_timeout_ms: 300000
    # Per-provider model aliases: client/route model -> actual upstream model.
    #model_mapping:
    #  gpt-4o: deepseek-chat
    # Request overrides (severely-reduced new-api override port; all set-only,
    # no expressions/conditions). param_override sets JSON body keys after the
    # model rewrite (candidate-level param_override wins on conflict);
    # param_delete removes keys; header_override sets headers on the upstream
    # request; header_pass forwards client headers matching the globs
    # (case-insensitive) even when the gateway blocklist would drop them.
    #param_override: {max_tokens: 4096, temperature: 1.0}
    #param_delete: ["top_k"]
    #header_override: {"X-Title": "tokenroute"}
    #header_pass: ["X-Custom-*"]

  - name: deepseek
    type: openai                    # openai-compatible API
    base_url: "https://api.deepseek.com/v1"
    api_key: "${DEEPSEEK_API_KEY}"
    # Optional key pool (round-robin per request; a key that gets an upstream
    # 401/429 cools down 60s and is skipped). api_key alone = pool of 1.
    # api_keys:
    #   - "${DEEPSEEK_API_KEY}"
    #   - "${DEEPSEEK_API_KEY_2}"
    priority: 5                     # lower = more preferred
    timeout_ms: 120000

  - name: ollama
    type: openai
    base_url: "http://localhost:11434/v1"
    # no api_key needed for local Ollama
    priority: 20
    timeout_ms: 300000

  # Anthropic Messages API (translated to/from OpenAI format at the boundary).
  # - name: anthropic
  #   type: anthropic
  #   base_url: "https://api.anthropic.com/v1"   # optional, this is the default
  #   api_key: "${ANTHROPIC_API_KEY}"
  #   priority: 15
  #   timeout_ms: 120000

  # Google Gemini generateContent API (translated to/from OpenAI format).
  # - name: gemini
  #   type: gemini
  #   base_url: "https://generativelanguage.googleapis.com/v1beta"  # default
  #   api_key: "${GEMINI_API_KEY}"
  #   priority: 25
  #   timeout_ms: 120000

routes:
  # Virtual model names clients use in "model" field.
  # strategy: priority (default) | round_robin | least_latency | weighted | cost |
  #           lkgp | headroom | fusion | p2c | reset_aware | fill_first | auto |
  #           lowest_usage
  # lowest_usage: fewest observed tokens in the current minute first (LiteLLM
  #              lowest_tpm_rpm_v2); unseen candidates first, ties by priority.
  # p2c:         power-of-2-choices — 2 random candidates, least-loaded first.
  # reset_aware: candidates whose quota window resets soonest first.
  # fill_first:  keep priority order; sink quota-exhausted candidates (pairs
  #              with free_tier: maximize one free tier before the next).
  # auto:        composite score = health × latency × cost × quota headroom
  #              (a single zero factor disqualifies; OmniRoute port).
  # Failover: retryable statuses (429/500/502/503/504) and transport errors
  # fall through to the next candidate; other statuses are relayed as-is.
  # A 429 whose body signals exhausted balance ("insufficient balance",
  # "credits exhausted") locks that provider+model for 15 minutes instead of
  # the short rate-limit cooldown — quota exhaustion is not a rate limit.
  # Client aborts (disconnect mid-stream) never trip circuit breakers.
  # Breakers gain a DEGRADED warning band at 60% of threshold (threshold>=4),
  # and the open cooldown doubles after 3 failed probe cycles (16x cap).
  - model: auto
    strategy: priority              # first candidate by priority; failover on retryable errors
    # multiplier scales the logged USD cost for this route (default 1.0).
    #multiplier: 1.0
    # fallback_routes (LiteLLM fallbacks): other virtual models tried, in
    # order, when EVERY candidate here fails retryably (max 3 route hops,
    # cycles skipped). Client errors (400/401/403) never trigger it.
    #fallback_routes: [cheap]
    # prompt_cache_affinity: pin requests with a cacheable prompt prefix to
    # the provider+model that served it (1h TTL) so provider-side prompt
    # caches hit; X-TokenRoute-Decision gains ;affinity=hit on a pin hit.
    # Global default: top-level prompt_cache_affinity: true (default false).
    #prompt_cache_affinity: true
    candidates:
      - provider: deepseek
        model: deepseek-chat
        # Optional group tags; keys with groups: ["team-x"] only reach
        # candidates sharing a group (empty on either side = wildcard).
        #groups: [team-x]
        # Tag-based routing labels: clients send X-Route-Tags: vision,cheap
        # (comma-separated; !tag excludes, &tag requires). Plain request tags
        # must be a subset of the candidate's tags; empty candidate tags match
        # everything except &requirements.
        #tags: [vision, us]
        # Candidate-level body overrides, applied AFTER the provider's
        # param_override/param_delete and winning on key conflict.
        #param_override: {max_tokens: 8192}
      - provider: openai
        model: gpt-4o-mini

  - model: balanced
    strategy: round_robin           # rotate starting candidate each request
    candidates:
      - provider: deepseek
        model: deepseek-chat
      - provider: openai
        model: gpt-4o-mini

  - model: fast
    strategy: least_latency         # lowest EMA latency first; unseen providers first
    candidates:
      - provider: ollama
        model: llama3.1
      - provider: deepseek
        model: deepseek-chat

  - model: mixed
    strategy: weighted              # weighted-random first pick (weight default 1);
    candidates:                     # remaining candidates stay in priority order
      - provider: deepseek
        model: deepseek-chat
        weight: 80
      - provider: openai
        model: gpt-4o-mini
        weight: 20

  - model: cheap
    strategy: cost                  # lowest prompt+completion price first;
    candidates:                     # unpriced models sort last
      - provider: openai
        model: gpt-4o
      - provider: deepseek
        model: deepseek-chat

  - model: sticky
    strategy: lkgp                  # last successfully serving provider first;
    candidates:                     # on its failure, back to priority order
      - provider: deepseek
        model: deepseek-chat
      - provider: openai
        model: gpt-4o-mini

  - model: smart
    candidates:                     # no strategy -> priority

# ── New: pricing sync, free-tier catalog, aliases, quota ──────────────

# LiteLLM community pricing sync (default on; "off" disables). Synced prices
# fill gaps only — prices: entries above always win. Refreshes every 24h.
#pricing_sync: "off"

# Free-tier budget catalog: seeds monthly quota windows per provider+model so
# fill_first/reset_aware/auto prefer candidates with live free budget, and
# quota_exhausted lockouts stop hot-looping a spent free tier.
#free_tier:
#  - {provider: gemini, model: gemini-2.5-flash, monthly_tokens: 60000000}
#  - {provider: mistral, model: mistral-small-latest, monthly_tokens: 1000000000}

# Global client-name aliases, resolved before route lookup (the body model is
# rewritten). Per-provider model_mapping still applies after route resolution.
#aliases:
#  deepseek-chat: auto            # client asks "deepseek-chat" -> route "auto"

# Per-provider token budget windows (pre-request awareness): strategies
# reset_aware/fill_first/auto read this ledger; quota_token_limit: 0 (default)
# = untracked. Actual usage is recorded after each response.
#providers:
#  - name: deepseek
#    quota_token_limit: 5000000     # tokens per window
#    quota_window_seconds: 86400    # window length (default 60)
      - provider: openai
        model: gpt-4o

  - model: roomy
    strategy: headroom              # fewest requests in the last 60s first;
    candidates:                     # ties fall back to priority order
      - provider: deepseek
        model: deepseek-chat
      - provider: openai
        model: gpt-4o-mini

  - model: duo
    strategy: fusion                # race first 2 candidates; fastest 200 wins,
    candidates:                     # tie broken by lower price
      - provider: deepseek
        model: deepseek-chat
      - provider: openai
        model: gpt-4o-mini

# Response cache (non-stream chat completions): identical requests within
# ttl are served from memory with X-TokenRoute-Cache: HIT and zero cost.
#cache:
#  enabled: true
#  ttl_seconds: 300

# Daily model-capability sync from models.dev (context windows, strictly
# additive below the hand-written price table). Default: on. Cache file
# lands beside usage_db as model-catalog.json.
#model_catalog: off

# POST /v1/search — web search with per-backend key pools, tried in order
# until one returns results. Each backend: tavily | brave | exa.
#search:
#  - backend: tavily
#    api_key: $TAVILY_API_KEY
#  - backend: brave
#    api_keys: [$BRAVE_KEY_A, $BRAVE_KEY_B]
#  - backend: exa
#    api_key: $EXA_API_KEY

# Global background health-check default (per-provider health_check: wins).
#health_check: {enabled: true, interval_ms: 60000}

# Global prompt-cache affinity default (per-route flag overrides).
#prompt_cache_affinity: true

# Retry/disable policy (new-api status_code_ranges + AutomaticDisableKeywords
# port). UNSET = current hardcoded behavior exactly (retry 429/500/502/503/504,
# 401/403 open the circuit fast). All fields optional within the block:
# retry_status_ranges — comma-separated codes/ranges triggering failover;
# never_retry — wins over ranges (504/524 recommended, they mean the upstream
# gateway never got a response); disable_status_ranges — statuses classified
# auth (instant circuit open); disable_keywords — case-insensitive body
# substrings classifying a retryable failure as auth/quota: keywords
# containing balance/credit/quota/insufficient become quota_exhausted (15min
# model lock), others auth.
# Group ratio (new-api group_ratio port): cost multiplier per group name.
# Effective multiplier = route.multiplier × product of ratios for groups in
# the key∩candidate intersection (a key in ["vip"] hitting a candidate in
# ["vip","us"] gets the "vip" ratio; multiple matches multiply all).
# Empty intersection = 1.0. Cost-only (usage log + X-TokenRoute-Cost-USD);
# routing/filtering unaffected. Unset = current behavior.
#group_ratio: {vip: 1.0, free: 1.2}

#retry_policy:
#  retry_status_ranges: "100-199,300-399,401-407,409-499,500-503,505-599"
#  never_retry: [504, 524]
#  disable_status_ranges: "401"
#  disable_keywords: ["insufficient balance", "account suspended", "quota exceeded"]
